services:
  - type: web
    name: anime-reader-mangadex-proxy
    runtime: node
    rootDir: render-proxy
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ALLOWED_ORIGIN
        sync: false
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: HOST
        value: anime-reader.onrender.com
      - key: SHOPIFY_SCOPES
        value: write_products,write_customers,write_orders
 
